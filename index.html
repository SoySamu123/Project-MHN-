<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Project MHN</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#001f4d,#0047ab);
    color:white;
    text-align:center;
}

header{
    padding:40px 20px;
}

h1{
    font-size:42px;
}

p{
    color:#d9e7ff;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:15px;
    width:85%;
    max-width:350px;
    margin:auto;
}

button{
    padding:18px;
    font-size:18px;
    border:none;
    border-radius:15px;
    background:white;
    color:#003366;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    transform:scale(1.03);
}

#contenido{
    width:90%;
    max-width:600px;
    margin:30px auto;
}

footer{
    margin-top:40px;
    color:#ccc;
}

.perfil{
    background:rgba(255,255,255,0.12);
    padding:25px;
    border-radius:20px;
}

.avatar{
    font-size:70px;
    margin:20px;
}

.perfil input,
.perfil select{
    display:block;
    width:90%;
    margin:10px auto;
    padding:12px;
    border-radius:10px;
    border:none;
    box-sizing:border-box;
}

.general{
    margin:20px;
    font-size:20px;
}

.general strong{
    display:block;
    font-size:50px;
}

</style>

</head>

<body>

<header>

<h1>⚽ PROJECT MHN ⚽</h1>

<p>MAKE HEROES NOW</p>

</header>


<div class="menu">

<button onclick="abrir('👤 Mi Perfil')">
👤 Mi Perfil
</button>

<button onclick="abrir('🏟️ Mi Club')">
🏟️ Mi Club
</button>

<button onclick="abrir('📊 Estadísticas')">
📊 Estadísticas
</button>

<button onclick="abrir('🤖 IA MHN')">
🤖 IA MHN
</button>

</div>


<div id="contenido"></div>


<footer>

Versión 0.4

</footer>


<script src="script.js?v=12"></script> 

</body>
</html>
